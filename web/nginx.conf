# Serves the website and forwards the backend's paths, so the browser sees a single origin
# (no CORS needed). In production Traefik sends the whole host here.

# Behind Traefik the original scheme arrives in X-Forwarded-Proto; locally there is no proxy in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # GET /api/factcheck/explanation/<id>/ waits up to 25 s, and a check can take a while.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
