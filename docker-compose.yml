# Django backend, plus MariaDB (vector search) and Ollama (embeddings) for the RAG search.
#   docker compose up --build -d --wait
#   docker compose exec ollama ollama pull bge-m3
services:
  backend:
    build:
      context: ./backend
      additional_contexts:
        rag: ./rag
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: backend/.env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      # MariaDB and Ollama below, over the compose network.
      RAG_DB_HOST: mariadb
      RAG_DB_PORT: "3306"
      RAG_OLLAMA_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Live-reload source for development.
      - ./backend:/app
      - ./rag/wikirag:/rag/wikirag
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mariadb:
    image: mariadb:lts            # vector search needs MariaDB 11.7 or later
    environment:
      MARIADB_ROOT_PASSWORD: wikirag
      MARIADB_DATABASE: wikirag
      MARIADB_USER: wikirag
      MARIADB_PASSWORD: wikirag
    ports:
      - "3307:3306"               # 3307 on the host, so it does not collide with a local MariaDB on 3306
    volumes:
      - wikirag-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - wikirag-ollama:/root/.ollama

volumes:
  wikirag-db:
  wikirag-ollama:
