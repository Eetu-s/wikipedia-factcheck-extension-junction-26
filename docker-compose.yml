# Django backend, plus MariaDB (vector search) and Ollama (embeddings) for the RAG search.
#   docker compose up --build -d --wait     # website: http://localhost:8080, API: http://localhost:8000
#   docker compose exec ollama ollama pull bge-m3
services:
  backend:
    build:
      context: ./backend
      additional_contexts:
        rag: ./rag
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: backend/.env
        required: false
    # Development server: reloads on code changes (the image's default command is gunicorn).
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECURE_SSL_REDIRECT: "0"
      # MariaDB and Ollama below, over the compose network.
      RAG_DB_HOST: mariadb
      RAG_DB_PORT: "3306"
      RAG_OLLAMA_URL: http://ollama:11434
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Live-reload source for development.
      - ./backend:/app
      - ./rag/wikirag:/rag/wikirag
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The website (web/): nginx serves the static files and forwards /api/ to the backend,
  # so the page and the API share one origin.
  frontend:
    build: ./web
    depends_on:
      - backend
    ports:
      - "8080:80"                 # http://localhost:8080
    volumes:
      # Live-reload the site during development.
      - ./web/public:/usr/share/nginx/html:ro

  mariadb:
    image: mariadb:lts            # vector search needs MariaDB 11.7 or later
    # Vector index cache (default 16 MB) and InnoDB cache. Too small makes vector search and
    # loading much slower; 1 GB each fits next to Ollama and the backend on an 8 GB server.
    command: ["--mhnsw-max-cache-size=1G", "--innodb-buffer-pool-size=1G"]
    environment:
      MARIADB_ROOT_PASSWORD: wikirag
      MARIADB_DATABASE: wikirag
      MARIADB_USER: wikirag
      MARIADB_PASSWORD: wikirag
    ports:
      - "3307:3306"               # 3307 on the host, so it does not collide with a local MariaDB on 3306
    volumes:
      - wikirag-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - wikirag-ollama:/root/.ollama

volumes:
  wikirag-db:
  wikirag-ollama:
