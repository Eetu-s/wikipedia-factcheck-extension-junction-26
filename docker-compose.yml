services:
  backend:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: backend/.env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    ports:
      - "8000:8000"
    volumes:
      # Live-reload source for development.
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
