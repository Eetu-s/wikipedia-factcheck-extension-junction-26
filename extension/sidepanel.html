<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Check an article or a selected claim against Wikipedia: verdicts, confidence and sources.">
  <title>Wikipedia Fact Check</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel">
    <header>
      <h1>Wikipedia Fact Check</h1>
    </header>

    <!-- Shown until a password is saved. -->
    <form id="login" class="stack" hidden>
      <h2>Log in</h2>
      <p id="loginError" class="error" role="alert"></p>
      <label for="backendUrl">Backend URL
        <input id="backendUrl" name="backendUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://klausde.tech">
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div><button type="submit">Log in</button></div>
    </form>

    <!-- Shown once logged in. -->
    <div id="main" class="stack" hidden>
      <div id="result" class="stack" aria-live="polite"></div>
      <div class="footer"><button id="logout" type="button" class="quiet">Log out</button></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
