# MariaDB with vector search, and Ollama for embedding questions.
#   docker compose -f rag/docker-compose.yml up -d --wait
#   docker compose -f rag/docker-compose.yml exec ollama ollama pull bge-m3
#
# On a Mac, Ollama installed natively (https://ollama.com) is much faster than in Docker, which
# cannot use the Apple GPU. For one question at a time the container is fine. If you run Ollama
# natively, skip this service: it uses the same port 11434.
services:
  mariadb:
    image: mariadb:lts            # vector search needs MariaDB 11.7 or later
    environment:
      MARIADB_ROOT_PASSWORD: wikirag
      MARIADB_DATABASE: wikirag
      MARIADB_USER: wikirag
      MARIADB_PASSWORD: wikirag
    ports:
      - "3307:3306"               # 3307, so it does not collide with a local MariaDB on 3306
    volumes:
      - wikirag-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - wikirag-ollama:/root/.ollama

volumes:
  wikirag-db:
  wikirag-ollama:
